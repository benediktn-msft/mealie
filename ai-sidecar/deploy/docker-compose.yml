# docker-compose.yml for the Mealie + Copilot proxy stack on the NUC.
#
# Lives at /home/nuc/docker/mealie/docker-compose.yml.
#
# Build the proxy locally on the NUC:
#   docker build -t copilot-proxy:latest /path/to/mealie-fork/ai-sidecar/copilot-proxy

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    ports:
      - "9925:9000"
    volumes:
      - ./data:/app/data
    environment:
      - ALLOW_SIGNUP=true
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
      - BASE_URL=http://mealie.nuc.lan
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      # Mealie's built-in AI features (image-to-recipe, video-to-recipe,
      # URL-to-recipe, etc.) talk to the proxy, NOT to OpenAI directly.
      # The proxy forwards to GitHub Copilot.
      - OPENAI_API_KEY=copilot-proxy
      - OPENAI_BASE_URL=http://copilot-proxy:8080/v1
      - OPENAI_MODEL=gpt-4o
      - OPENAI_ENABLE_IMAGE_SERVICES=true
      - OPENAI_ENABLE_TRANSCRIPTION_SERVICES=true
    depends_on:
      - copilot-proxy
    deploy:
      resources:
        limits:
          memory: 512M

  copilot-proxy:
    image: copilot-proxy:latest
    container_name: copilot-proxy
    restart: unless-stopped
    volumes:
      - ./copilot-token.json:/data/copilot-token.json:ro
    environment:
      - COPILOT_TOKEN_FILE=/data/copilot-token.json
      # Optional emergency fallback. Leave empty to fail closed.
      - OPENAI_FALLBACK_KEY=${OPENAI_FALLBACK_KEY:-}
    deploy:
      resources:
        limits:
          memory: 64M
